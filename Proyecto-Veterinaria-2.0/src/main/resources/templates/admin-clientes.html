<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DogTor - Panel de Administración">
    <title>DogTor | Panel Admin - Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2A9D8F',
                        secondary: '#F4A261',
                        accent: '#E9C46A',
                        bglight: '#FAFAFA',
                        textdark: '#264653'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-bglight text-textdark font-sans flex flex-col min-h-screen">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a th:href="@{/}" class="flex items-center gap-2 text-primary font-bold text-2xl hover:opacity-80 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <ellipse cx="5" cy="10" rx="2.5" ry="3.5" transform="rotate(-30 5 10)"/>
                    <ellipse cx="9.5" cy="5" rx="2.5" ry="3.5" transform="rotate(-10 9.5 5)"/>
                    <ellipse cx="14.5" cy="5" rx="2.5" ry="3.5" transform="rotate(10 14.5 5)"/>
                    <ellipse cx="19" cy="10" rx="2.5" ry="3.5" transform="rotate(30 19 10)"/>
                    <path d="M 12 11 C 5 11, 3 15, 5 19 C 7 22, 10 21, 12 18 C 14 21, 17 22, 19 19 C 21 15, 19 11, 12 11 Z"/>
                </svg>
                DogTor
            </a>
            <nav class="flex flex-wrap gap-4 items-center text-sm font-medium">
                <a th:href="@{/admin/clientes}" class="hover:text-primary transition-colors font-bold text-primary">Clientes</a>
                <a th:href="@{/admin/mascotas}" class="hover:text-primary transition-colors">Mascotas</a>
                <a th:href="@{/admin/veterinarios}" class="hover:text-primary transition-colors">Veterinarios</a>
                <a th:href="@{/logout}" class="hover:text-primary transition-colors">Cerrar sesión</a>
            </nav>
        </div>
    </header>

<main class="flex-grow bg-bglight py-12 px-6">
    <div class="container mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-textdark">Gestión de Clientes</h2>
            <a th:href="@{/admin/clientes/nuevo}" class="bg-secondary text-white px-5 py-3 rounded-xl font-bold hover:bg-orange-500 transition shadow-md">+ Nuevo Cliente</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-teal-50 border-b border-teal-100">
                        <th class="p-4 font-bold text-textdark">ID</th>
                        <th class="p-4 font-bold text-textdark">Nombre</th>
                        <th class="p-4 font-bold text-textdark">Correo</th>
                        <th class="p-4 font-bold text-textdark">Teléfono</th>
                        <th class="p-4 font-bold text-textdark">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}" class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-4 text-gray-600" th:text="${cliente.id}"></td>
                        <td class="p-4 font-bold text-primary" th:text="${cliente.nombre}"></td>
                        <td class="p-4 text-gray-600" th:text="${cliente.correo}"></td>
                        <td class="p-4 text-gray-600" th:text="${cliente.telefono}"></td>
                        <td class="p-4 flex gap-2">
                            <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.id})}" class="bg-accent text-textdark px-3 py-2 rounded-lg font-bold hover:opacity-80 transition text-sm">Editar</a>
                            <form th:action="@{/admin/clientes/{id}/eliminar(id=${cliente.id})}" method="POST" onsubmit="return confirm('¿Eliminar este cliente?');">
                                <button type="submit" class="bg-red-500 text-white px-3 py-2 rounded-lg font-bold hover:bg-red-600 transition text-sm">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

    <footer class="bg-textdark text-gray-300 py-6 px-6 mt-auto text-center text-xs">
        <p>&copy; 2026 DogTor Clínica Veterinaria. Panel de Administración.</p>
    </footer>
</body>
</html>
