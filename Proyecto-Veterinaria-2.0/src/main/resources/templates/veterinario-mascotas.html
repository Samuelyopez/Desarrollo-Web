<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTor | Panel Veterinario - Mascotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#2A9D8F', secondary: '#F4A261', accent: '#E9C46A', bglight: '#FAFAFA', textdark: '#264653' } } }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-bglight text-textdark font-sans flex flex-col min-h-screen">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a th:href="@{/}" class="flex items-center gap-2 text-primary font-bold text-2xl hover:opacity-80 transition-opacity">DogTor</a>
            <nav class="flex flex-wrap gap-4 items-center text-sm font-medium">
                <a th:href="@{/veterinario}" class="hover:text-primary transition-colors">Clientes</a>
                <a th:href="@{/veterinario/mascotas}" class="hover:text-primary transition-colors font-bold text-primary">Mascotas</a>
                <a th:href="@{/logout}" class="hover:text-primary transition-colors">Cerrar sesión</a>
            </nav>
        </div>
    </header>

<main class="flex-grow bg-bglight py-12 px-6">
    <div class="container mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-textdark">Mascotas Registradas</h2>
            <a th:href="@{/veterinario/mascotas/nuevo}" class="bg-secondary text-white px-5 py-3 rounded-xl font-bold hover:bg-orange-500 transition shadow-md">+ Nueva Mascota</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-teal-50 border-b border-teal-100">
                        <th class="p-4 font-bold text-textdark">ID</th>
                        <th class="p-4 font-bold text-textdark">Nombre</th>
                        <th class="p-4 font-bold text-textdark">Raza</th>
                        <th class="p-4 font-bold text-textdark">Edad</th>
                        <th class="p-4 font-bold text-textdark">Dueño</th>
                        <th class="p-4 font-bold text-textdark">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mascota : ${mascotas}" class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-4 text-gray-600" th:text="${mascota.id}"></td>
                        <td class="p-4 font-bold text-primary" th:text="${mascota.nombre}"></td>
                        <td class="p-4 text-gray-600" th:text="${mascota.raza}"></td>
                        <td class="p-4 text-gray-600" th:text="${mascota.edad}"></td>
                        <td class="p-4 text-gray-600" th:text="${mascota.dueno != null ? mascota.dueno.nombre : '—'}"></td>
                        <td class="p-4 flex gap-2">
                            <a th:href="@{/veterinario/mascotas/editar/{id}(id=${mascota.id})}" class="bg-accent text-textdark px-3 py-2 rounded-lg font-bold hover:opacity-80 transition text-sm">Editar</a>
                            <form th:action="@{/veterinario/mascotas/{id}/eliminar(id=${mascota.id})}" method="POST" onsubmit="return confirm('¿Eliminar esta mascota?');">
                                <button type="submit" class="bg-red-500 text-white px-3 py-2 rounded-lg font-bold hover:bg-red-600 transition text-sm">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

    <footer class="bg-textdark text-gray-300 py-6 px-6 mt-auto text-center text-xs">
        <p>&copy; 2026 DogTor Clínica Veterinaria. Panel de Veterinario.</p>
    </footer>
</body>
</html>
