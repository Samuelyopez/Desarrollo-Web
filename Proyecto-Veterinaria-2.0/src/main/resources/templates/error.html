<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTor | Ha ocurrido un error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#2A9D8F', secondary: '#F4A261', accent: '#E9C46A', bglight: '#FAFAFA', textdark: '#264653' } } }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-bglight text-textdark font-sans flex flex-col min-h-screen">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a th:href="@{/}" class="flex items-center gap-2 text-primary font-bold text-2xl hover:opacity-80 transition-opacity">DogTor</a>
            <nav class="flex flex-wrap gap-4 items-center text-sm font-medium">
                <a th:href="@{/}" class="hover:text-primary transition-colors">Inicio</a>
            </nav>
        </div>
    </header>

<main class="flex-grow flex items-center justify-center bg-teal-50 py-12 px-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-lg w-full text-center">
        <p class="text-6xl mb-4">🐾</p>
        <h1 class="text-3xl font-bold text-primary mb-2">¡Ups! Algo salió mal</h1>
        <p class="text-gray-600 mb-1" th:if="${status != null}">Código de error: <span th:text="${status}"></span></p>
        <p class="text-gray-600 mb-6" th:text="${error != null and !error.isEmpty()} ? ${error} : 'No pudimos encontrar o procesar lo que buscabas.'"></p>
        <a th:href="@{/}" class="inline-block bg-secondary text-white font-bold py-3 px-8 rounded-xl hover:bg-orange-500 transition">Volver al inicio</a>
    </div>
</main>

    <footer class="bg-textdark text-gray-300 py-6 px-6 mt-auto text-center text-xs">
        <p>&copy; 2026 DogTor Clínica Veterinaria.</p>
    </footer>
</body>
</html>
