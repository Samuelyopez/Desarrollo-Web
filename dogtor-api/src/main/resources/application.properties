spring.application.name=dogtor-api

# Puerto de la API (Angular corre en el 4200)
server.port=8090

# ===== Base de datos H2 en archivo (./data/dogtordb.mv.db) =====
spring.datasource.url=jdbc:h2:file:./data/dogtordb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola de administración de H2 -> http://localhost:8090/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ===== JPA / Hibernate =====
# update: conserva los datos entre reinicios (el DataLoader solo siembra si la BD está vacía)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Swagger / OpenAPI =====
# Documentación -> http://localhost:8090/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
