<header class="sticky-top bg-white shadow-sm">
  <nav class="navbar navbar-expand-lg bg-white">
    <div class="container">
      <a [routerLink]="['/']" class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-dogtor">
        <!-- Icono huella (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <ellipse cx="5" cy="10" rx="2.5" ry="3.5" transform="rotate(-30 5 10)" />
          <ellipse cx="9.5" cy="5" rx="2.5" ry="3.5" transform="rotate(-10 9.5 5)" />
          <ellipse cx="14.5" cy="5" rx="2.5" ry="3.5" transform="rotate(10 14.5 5)" />
          <ellipse cx="19" cy="10" rx="2.5" ry="3.5" transform="rotate(30 19 10)" />
          <path d="M 12 11 C 5 11, 3 15, 5 19 C 7 22, 10 21, 12 18 C 14 21, 17 22, 19 19 C 21 15, 19 11, 12 11 Z" />
        </svg>
        DogTor
      </a>

      <button
        class="navbar-toggler border-0 text-dogtor"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal"
        aria-expanded="false"
        aria-label="Abrir menú"
      >
        <i class="bi bi-list fs-1"></i>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto gap-lg-3 fw-medium align-items-lg-center">
          @for (link of links(); track link.ruta) {
            <li class="nav-item">
              <a
                class="nav-link"
                [routerLink]="link.ruta"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: link.texto === 'Inicio' || link.texto === 'Mi portal' }"
              >
                {{ link.texto }}
              </a>
            </li>
          }

          @if (auth.usuario(); as usuario) {
            <li class="nav-item d-flex align-items-center gap-2 py-2 py-lg-0">
              <span class="small">
                <i class="bi bi-person-circle text-dogtor"></i>
                <span class="fw-bold">{{ usuario.nombre }}</span>
                <span class="text-muted ms-1">({{ nombreRol[usuario.rol] }})</span>
              </span>
              <button type="button" class="btn btn-sm btn-outline-secondary" (click)="salir()">
                <i class="bi bi-box-arrow-right"></i> Salir
              </button>
            </li>
          } @else {
            <li class="nav-item py-2 py-lg-0">
              <a [routerLink]="['/login']" class="btn btn-dogtor px-4">Ingresar</a>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>
