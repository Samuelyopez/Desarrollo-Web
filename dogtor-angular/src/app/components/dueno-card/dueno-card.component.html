@if (dueno(); as duenoActual) {
  <div class="border rounded-3 p-3 bg-light">
    <p class="fw-bold mb-2"><i class="bi bi-person"></i> {{ duenoActual.nombre }}</p>
    <p class="small mb-1"><i class="bi bi-person-vcard"></i> C.C. {{ duenoActual.cedula }}</p>
    <p class="small mb-1"><i class="bi bi-phone"></i> {{ duenoActual.celular || '—' }}</p>
    <p class="small mb-0"><i class="bi bi-envelope"></i> {{ duenoActual.correo || '—' }}</p>
  </div>
} @else {
  <p class="text-muted mb-0">Sin dueño asignado</p>
}
