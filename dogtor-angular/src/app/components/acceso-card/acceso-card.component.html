@if (acceso().ruta) {
  <a [routerLink]="acceso().ruta" class="acceso card h-100 border-0 shadow-sm rounded-4 text-reset">
    <div class="card-body p-4">
      <i class="bi fs-1 text-dogtor" [class]="acceso().icono"></i>
      <h2 class="h5 fw-bold mt-2">{{ acceso().titulo }}</h2>
      <p class="small text-muted mb-0">{{ acceso().descripcion }}</p>
    </div>
  </a>
} @else {
  <div class="card h-100 border-0 shadow-sm rounded-4 opacity-50">
    <div class="card-body p-4">
      <i class="bi fs-1 text-muted" [class]="acceso().icono"></i>
      <h2 class="h5 fw-bold mt-2">{{ acceso().titulo }}</h2>
      <p class="small text-muted mb-1">{{ acceso().descripcion }}</p>
      <span class="badge text-bg-light border">Próximamente</span>
    </div>
  </div>
}
