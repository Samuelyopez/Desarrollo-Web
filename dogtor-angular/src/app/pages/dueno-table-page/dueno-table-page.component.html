<div class="container py-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <app-page-title
      titulo="Gestión de Dueños"
      subtitulo="Consulta los clientes de la clínica y mantén sus datos de contacto al día"
    ></app-page-title>
    <a [routerLink]="['/vet/dueno/new']" class="btn btn-dogtor-secondary">
      <i class="bi bi-plus-lg"></i> Nuevo Dueño
    </a>
  </div>

  <app-alerta-flash [(mensaje)]="mensaje" [tipo]="tipoMensaje"></app-alerta-flash>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <h3 class="h4 fw-bold mb-0">
      Dueños ({{ duenos.length }})
      @if (cargando) {
        <app-cargando tamano="linea"></app-cargando>
      }
    </h3>
    <app-buscador campoId="buscarDueno" etiqueta="Buscar" placeholder="Buscar por nombre, cédula, celular o correo" [valor]="filtro" (buscar)="buscar($event)"></app-buscador>
  </div>

  <app-dueno-table [duenoArray]="duenos" (duenoEliminado)="eliminarDueno($event)"></app-dueno-table>
</div>
