<div class="container py-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <app-page-title
      titulo="Gestión de Dueños"
      subtitulo="Consulta los clientes de la clínica y mantén sus datos de contacto al día"
    ></app-page-title>
    <a [routerLink]="['/dueno/new']" class="btn btn-dogtor-secondary">
      <i class="bi bi-plus-lg"></i> Nuevo Dueño
    </a>
  </div>

  @if (mensaje) {
    <div class="alert alert-dismissible fade show" [class]="'alert-' + tipoMensaje" role="alert">
      {{ mensaje }}
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarMensaje()"></button>
    </div>
  }

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <h3 class="h4 fw-bold mb-0">Dueños ({{ duenos.length }} de {{ totalDuenos }})</h3>
    <div class="buscador">
      <label for="buscarDueno" class="visually-hidden">Buscar dueño</label>
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input
          id="buscarDueno"
          type="search"
          class="form-control"
          placeholder="Buscar por nombre, teléfono o dirección"
          [value]="filtro"
          (input)="buscar($any($event.target).value)"
        />
      </div>
    </div>
  </div>

  <app-dueno-table [duenoArray]="duenos" (duenoEliminado)="eliminarDueno($event)"></app-dueno-table>
</div>
