<app-form-card titulo="Dar tratamiento" subtitulo="Solo mascotas activas y medicamentos con unidades disponibles" ancho="ancho">
  @if (errorMensaje) {
    <app-alerta-error [mensaje]="errorMensaje" variante="formulario"></app-alerta-error>
  }
  @if (avisoMascota) {
    <div class="alert alert-warning small" role="alert">
      <i class="bi bi-info-circle"></i> {{ avisoMascota }}
    </div>
  }

  <form [formGroup]="tratamientoForm" novalidate>
    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label for="veterinario" class="form-label fw-bold">Veterinario</label>
        <input id="veterinario" class="form-control" [value]="veterinario.nombre" readonly />
      </div>
      <div class="col-sm-6">
        <label for="fecha" class="form-label fw-bold">Fecha</label>
        <input id="fecha" class="form-control" [value]="hoy | date: 'dd/MM/yyyy'" readonly />
      </div>
    </div>

    <app-campo-select
      campoId="mascota"
      etiqueta="Mascota"
      placeholder="Selecciona una mascota activa..."
      [control]="tratamientoForm.controls.mascota"
      [opciones]="mascotas"
      [textoOpcion]="textoMascota"
      [valorOpcion]="idMascota"
      [mensajes]="mensajes.mascota"
    ></app-campo-select>

    @if (!cargando && medicamentos.length === 0) {
      <div class="alert alert-warning small">No hay medicamentos con unidades disponibles.</div>
    } @else {
      <app-campo-select
        campoId="medicamento"
        etiqueta="Medicamento"
        placeholder="Selecciona un medicamento..."
        [control]="tratamientoForm.controls.medicamento"
        [opciones]="medicamentos"
        [textoOpcion]="textoMedicamento"
        [compararCon]="compararMedicamentos"
        [mensajes]="mensajes.medicamento"
      ></app-campo-select>
    }

    <div class="row g-3 align-items-end mb-2">
      <div class="col-sm-6">
        <label for="cantidad" class="form-label fw-bold">Cantidad</label>
        <input
          id="cantidad"
          type="number"
          class="form-control"
          min="1"
          [max]="tratamientoForm.controls.medicamento.value?.unidadesDisponibles ?? 1"
          formControlName="cantidad"
          [class.is-invalid]="tratamientoForm.controls.cantidad.touched && tratamientoForm.controls.cantidad.invalid"
        />
        <app-campo-error [control]="tratamientoForm.controls.cantidad" [mensajes]="mensajesCantidad"></app-campo-error>
      </div>
      <div class="col-sm-6 text-sm-end">
        <span class="small text-muted d-block">Total estimado</span>
        <span class="fs-4 fw-bold text-dogtor">{{ total | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</span>
      </div>
    </div>

    <app-form-acciones
      texto="Registrar tratamiento"
      [cargando]="cargando"
      [deshabilitado]="medicamentos.length === 0"
      [rutaCancelar]="rutaVolver"
    ></app-form-acciones>
  </form>
</app-form-card>
