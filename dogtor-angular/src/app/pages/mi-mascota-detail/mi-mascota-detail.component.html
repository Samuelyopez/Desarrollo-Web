<div class="container py-5">
  <app-volver-link [ruta]="['/cliente/mascotas']" texto="Volver a mis mascotas"></app-volver-link>

  @if (cargando) {
    <app-cargando></app-cargando>
  } @else if (mascota) {
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <app-mascota-info-card [mascota]="mascota" modo="cliente"></app-mascota-info-card>

        <h2 class="h4 fw-bold mb-3">Historial de tratamientos ({{ tratamientos.length }})</h2>
        <app-tratamiento-list [tratamientos]="tratamientos"></app-tratamiento-list>
      </div>
    </div>
  } @else {
    <app-alerta-error
      variante="pagina"
      [mensaje]="noEncontrada ? 'No encontramos esa mascota entre las tuyas.' : errorMensaje"
    ></app-alerta-error>
  }
</div>
