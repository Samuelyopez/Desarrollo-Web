<div class="container py-5">
  <app-volver-link [ruta]="['/vet/duenos']" texto="Volver a dueños"></app-volver-link>
  <app-alerta-flash [(mensaje)]="mensaje"></app-alerta-flash>

  @if (cargando) {
    <app-cargando></app-cargando>
  } @else if (dueno) {
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="card border-0 shadow rounded-4 mb-4">
          <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
              <div>
                <h1 class="h2 fw-bold text-dogtor mb-1">{{ dueno.nombre }}</h1>
                <p class="small text-muted mb-0">C.C. {{ dueno.cedula }}</p>
              </div>
              <a [routerLink]="['/vet/dueno/update', dueno.cedula]" class="btn btn-dogtor-accent">
                <i class="bi bi-pencil"></i> Editar
              </a>
            </div>

            <app-dueno-card [dueno]="dueno"></app-dueno-card>
          </div>
        </div>

        <!-- Mascotas del dueño -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h4 fw-bold mb-0">Mascotas ({{ mascotas.length }})</h2>
          <a [routerLink]="['/vet/mascota/new']" [queryParams]="{ dueno: dueno.cedula }" class="btn btn-sm btn-dogtor-secondary">
            <i class="bi bi-plus-lg"></i> Agregar mascota
          </a>
        </div>
        @for (mascota of mascotas; track mascota.id) {
          <app-mascota-item [mascota]="mascota" [ruta]="['/vet/mascota', mascota.id]"></app-mascota-item>
        } @empty {
          <app-estado-vacio mensaje="Este dueño aún no tiene mascotas registradas."></app-estado-vacio>
        }
      </div>
    </div>
  } @else {
    <app-alerta-error
      variante="pagina"
      [mensaje]="noEncontrado ? 'No se encontró un dueño con la cédula ' + cedula + '.' : errorMensaje"
    ></app-alerta-error>
  }
</div>
