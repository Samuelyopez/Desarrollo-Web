<app-form-card [titulo]="isEdit ? 'Editar Mascota' : 'Nueva Mascota'">
  @if (noEncontrada) {
    <app-alerta-error mensaje="No se encontró la mascota." variante="formulario"></app-alerta-error>
    <a [routerLink]="[portal.base + '/mascotas']" class="btn btn-dogtor w-100">Volver a mascotas</a>
  } @else {
    @if (errorMensaje) {
      <app-alerta-error [mensaje]="errorMensaje" variante="formulario"></app-alerta-error>
    }

    <form [formGroup]="mascotaForm" novalidate>
      <app-campo-texto
        campoId="nombre"
        etiqueta="Nombre"
        [control]="mascotaForm.controls.nombre"
        [mensajes]="mensajes.nombre"
      ></app-campo-texto>
      <app-campo-texto
        campoId="raza"
        etiqueta="Raza"
        [control]="mascotaForm.controls.raza"
        [mensajes]="mensajes.raza"
      ></app-campo-texto>
      <div class="row g-3">
        <div class="col-sm-6">
          <app-campo-texto
            campoId="edad"
            etiqueta="Edad (años)"
            placeholder="Ej: 2"
            [control]="mascotaForm.controls.edad"
            [mensajes]="mensajes.edad"
          ></app-campo-texto>
        </div>
        <div class="col-sm-6">
          <app-campo-texto
            campoId="peso"
            etiqueta="Peso (kg)"
            placeholder="Ej: 8.5"
            [control]="mascotaForm.controls.peso"
            [mensajes]="mensajes.peso"
          ></app-campo-texto>
        </div>
      </div>
      <app-campo-texto
        campoId="enfermedad"
        etiqueta="Enfermedad"
        placeholder="Puede quedar vacía mientras se diagnostica"
        [control]="mascotaForm.controls.enfermedad"
        [mensajes]="mensajes.enfermedad"
      ></app-campo-texto>
      <app-campo-texto
        campoId="foto"
        etiqueta="Foto (URL)"
        placeholder="https://..."
        [control]="mascotaForm.controls.foto"
        [mensajes]="mensajes.foto"
      ></app-campo-texto>
      <app-foto-preview
        [url]="mascotaForm.controls.foto.valid ? mascotaForm.controls.foto.value : null"
      ></app-foto-preview>
      <app-campo-select
        campoId="dueno"
        etiqueta="Dueño"
        placeholder="Selecciona un dueño..."
        [control]="mascotaForm.controls.dueno"
        [opciones]="duenos"
        [textoOpcion]="textoDueno"
        [compararCon]="compararDuenos"
        [mensajes]="mensajes.dueno"
      ></app-campo-select>

      <app-form-acciones [cargando]="cargando" [rutaCancelar]="rutaVolver"></app-form-acciones>
    </form>
  }
</app-form-card>
