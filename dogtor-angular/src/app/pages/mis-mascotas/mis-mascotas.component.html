<div class="container py-5">
  <div class="mb-4">
    <app-page-title
      seccion="Portal cliente"
      titulo="Mis mascotas"
      subtitulo="Consulta el estado de tus mascotas y los tratamientos que han recibido."
    ></app-page-title>
  </div>

  @if (cargando) {
    <app-cargando></app-cargando>
  } @else if (errorMensaje) {
    <app-alerta-error [mensaje]="errorMensaje"></app-alerta-error>
  } @else {
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
      @for (mascota of mascotas; track mascota.id) {
        <div class="col">
          <app-mascota-card [mascota]="mascota"></app-mascota-card>
        </div>
      } @empty {
        <div class="col-12">
          <app-estado-vacio mensaje="Aún no tienes mascotas registradas en la clínica."></app-estado-vacio>
        </div>
      }
    </div>
  }
</div>
