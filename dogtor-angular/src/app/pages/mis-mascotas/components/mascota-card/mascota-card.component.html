<a [routerLink]="['/cliente/mascota', mascota().id]" class="tarjeta card h-100 border-0 shadow-sm rounded-4 text-reset">
  <div class="card-body p-4 text-center d-flex flex-column">
    <app-mascota-avatar [fotoUrl]="mascota().foto" [nombre]="mascota().nombre" [tamano]="120"></app-mascota-avatar>
    <h2 class="h4 fw-bold text-dogtor mt-3 mb-1">{{ mascota().nombre }}</h2>
    <p class="small text-muted mb-2">
      {{ mascota().raza || 'Sin raza' }} · {{ mascota().edad != null ? mascota().edad + ' año(s)' : 'Edad sin registrar' }}
    </p>
    <div class="mb-3">
      <app-estado-badge [activa]="mascota().activa" textoActiva="En la clínica" textoInactiva="En casa"></app-estado-badge>
    </div>
    <p class="small mb-3">
      <i class="bi bi-clipboard2-pulse text-dogtor"></i> {{ mascota().enfermedad || 'Sin diagnóstico' }}
    </p>
    <span class="btn btn-dogtor btn-sm mt-auto">Ver detalle</span>
  </div>
</a>
