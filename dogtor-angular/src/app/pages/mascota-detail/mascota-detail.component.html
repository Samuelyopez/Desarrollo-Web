<div class="container py-5">
  <app-volver-link [ruta]="['/vet/mascotas']" texto="Volver a mascotas"></app-volver-link>
  <app-alerta-flash [(mensaje)]="mensaje"></app-alerta-flash>

  @if (cargando) {
    <app-cargando></app-cargando>
  } @else if (mascota) {
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <app-mascota-info-card [mascota]="mascota" [dueno]="dueno"></app-mascota-info-card>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h4 fw-bold mb-0">Historial de tratamientos ({{ tratamientos.length }})</h2>
          @if (mascota.activa) {
            <a [routerLink]="['/vet/tratamiento/new']" [queryParams]="{ mascota: mascota.id }" class="btn btn-sm btn-dogtor-secondary">
              <i class="bi bi-capsule"></i> Dar tratamiento
            </a>
          } @else {
            <span class="small text-muted"><i class="bi bi-house"></i> Está en casa: actívala para darle tratamiento</span>
          }
        </div>
        <app-tratamiento-list [tratamientos]="tratamientos" [mostrarPrecios]="true"></app-tratamiento-list>
      </div>
    </div>
  } @else {
    <app-alerta-error
      variante="pagina"
      [mensaje]="noEncontrada ? 'No se encontró la mascota con id ' + mascotaId + '.' : errorMensaje"
    ></app-alerta-error>
  }
</div>
