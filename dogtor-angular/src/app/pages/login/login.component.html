<app-form-card titulo="Ingresar" subtitulo="Clientes, veterinarios y administradores" icono="bi-person-circle" ancho="angosto">
  @if (errorMensaje) {
    <app-alerta-error [mensaje]="errorMensaje" variante="formulario"></app-alerta-error>
  }

  <form [formGroup]="loginForm" novalidate>
    <app-campo-texto
      campoId="correo"
      etiqueta="Correo"
      tipo="email"
      placeholder="tu@correo.com"
      [control]="loginForm.controls.correo"
      [mensajes]="mensajes.correo"
    ></app-campo-texto>
    <app-campo-texto
      campoId="password"
      etiqueta="Contraseña"
      tipo="password"
      [control]="loginForm.controls.password"
      [mensajes]="mensajes.password"
    ></app-campo-texto>

    <app-form-acciones texto="Ingresar" textoCargando="Ingresando..." estilo="primario" [cargando]="cargando"></app-form-acciones>
  </form>
</app-form-card>
