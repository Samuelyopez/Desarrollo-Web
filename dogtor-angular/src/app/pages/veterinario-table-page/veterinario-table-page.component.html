<div class="container py-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <app-page-title
      titulo="Gestión de Veterinarios"
      subtitulo="Registra al personal médico y administra su estado laboral"
    ></app-page-title>
    <a [routerLink]="['/admin/veterinario/new']" class="btn btn-dogtor-secondary">
      <i class="bi bi-plus-lg"></i> Nuevo Veterinario
    </a>
  </div>

  @if (mensaje) {
    <div class="alert alert-dismissible fade show" [class]="'alert-' + tipoMensaje" role="alert">
      {{ mensaje }}
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="cerrarMensaje()"></button>
    </div>
  }

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <h3 class="h4 fw-bold mb-0">
      Veterinarios ({{ veterinarios.length }}) · {{ totalActivos }} activos
      @if (cargando) {
        <span class="spinner-border spinner-border-sm text-dogtor ms-2" role="status" aria-label="Cargando"></span>
      }
    </h3>
    <div class="d-flex flex-wrap gap-2 filtros">
      <label for="filtroEstado" class="visually-hidden">Estado</label>
      <select id="filtroEstado" class="form-select estado" [value]="filtroEstado" (change)="cambiarFiltroEstado($any($event.target).value)">
        <option value="todos">Todos</option>
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
      </select>
      <div class="buscador">
        <label for="buscarVeterinario" class="visually-hidden">Buscar veterinario</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input
            id="buscarVeterinario"
            type="search"
            class="form-control"
            placeholder="Buscar por nombre, cédula, especialidad o correo"
            [value]="filtro"
            (input)="buscar($any($event.target).value)"
          />
        </div>
      </div>
    </div>
  </div>

  <app-veterinario-table
    [veterinarioArray]="veterinariosFiltrados"
    (estadoCambiado)="cambiarEstadoVeterinario($event)"
  ></app-veterinario-table>
</div>
