<div class="fondo py-5 px-3">
  <div class="row justify-content-center g-0">
    <div class="col-md-8 col-lg-5">
      <div class="card border-0 shadow rounded-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold text-dogtor text-center mb-4">
            @if (isEdit) { Editar Dueño } @else { Nuevo Dueño }
          </h2>

          @if (noEncontrado) {
            <div class="alert alert-danger text-center">No se encontró el dueño.</div>
            <a [routerLink]="['/duenos']" class="btn btn-dogtor w-100">Volver a dueños</a>
          } @else {
            <form [formGroup]="duenoForm" (ngSubmit)="handleSubmit()" novalidate>
              <app-campo-texto
                campoId="nombre"
                etiqueta="Nombre completo"
                placeholder="Ej: Juan Pérez"
                [control]="duenoForm.controls.nombre"
                [mensajes]="mensajes.nombre"
              ></app-campo-texto>
              <app-campo-texto
                campoId="telefono"
                etiqueta="Teléfono"
                placeholder="Ej: 3001234567"
                [control]="duenoForm.controls.telefono"
                [mensajes]="mensajes.telefono"
              ></app-campo-texto>
              <app-campo-texto
                campoId="direccion"
                etiqueta="Dirección (opcional)"
                placeholder="Ej: Calle 10 # 5-20"
                [control]="duenoForm.controls.direccion"
                [mensajes]="mensajes.direccion"
              ></app-campo-texto>

              <button type="submit" class="btn btn-dogtor-secondary w-100 py-2 rounded-3 mt-2" [disabled]="!duenoForm.valid">
                Guardar
              </button>
              <a [routerLink]="['/duenos']" class="d-block text-center small text-muted mt-3 cancelar">Cancelar</a>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
