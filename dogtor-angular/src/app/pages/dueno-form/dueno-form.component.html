<div class="fondo py-5 px-3">
  <div class="row justify-content-center g-0">
    <div class="col-md-8 col-lg-5">
      <div class="card border-0 shadow rounded-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold text-dogtor text-center mb-4">
            @if (isEdit) { Editar Dueño } @else { Nuevo Dueño }
          </h2>

          @if (noEncontrado) {
            <div class="alert alert-danger text-center">No se encontró el dueño.</div>
            <a [routerLink]="['/vet/duenos']" class="btn btn-dogtor w-100">Volver a dueños</a>
          } @else {
            @if (errorMensaje) {
              <div class="alert alert-danger small" role="alert">
                <i class="bi bi-exclamation-triangle"></i> {{ errorMensaje }}
              </div>
            }

            <form [formGroup]="duenoForm" novalidate>
              <app-campo-texto
                campoId="cedula"
                etiqueta="Cédula"
                placeholder="Ej: 1000000001"
                [control]="duenoForm.controls.cedula"
                [mensajes]="mensajes.cedula"
              ></app-campo-texto>
              <app-campo-texto
                campoId="nombre"
                etiqueta="Nombre completo"
                placeholder="Ej: Juan Pérez"
                [control]="duenoForm.controls.nombre"
                [mensajes]="mensajes.nombre"
              ></app-campo-texto>
              <app-campo-texto
                campoId="celular"
                etiqueta="Celular"
                placeholder="Ej: 3001234567"
                [control]="duenoForm.controls.celular"
                [mensajes]="mensajes.celular"
              ></app-campo-texto>
              <app-campo-texto
                campoId="correo"
                etiqueta="Correo"
                tipo="email"
                placeholder="Ej: juan.perez@correo.com"
                [control]="duenoForm.controls.correo"
                [mensajes]="mensajes.correo"
              ></app-campo-texto>
              <app-campo-texto
                campoId="password"
                [etiqueta]="isEdit ? 'Nueva contraseña (opcional)' : 'Contraseña de acceso'"
                tipo="password"
                [placeholder]="isEdit ? 'Déjala vacía para no cambiarla' : 'Mínimo 6 caracteres'"
                [control]="duenoForm.controls.password"
                [mensajes]="mensajes.password"
              ></app-campo-texto>

              <button type="submit" class="btn btn-dogtor-secondary w-100 py-2 rounded-3 mt-2" [disabled]="cargando">
                @if (cargando) {
                  <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                }
                Guardar
              </button>
              <a [routerLink]="['/vet/duenos']" class="d-block text-center small text-muted mt-3 cancelar">Cancelar</a>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
