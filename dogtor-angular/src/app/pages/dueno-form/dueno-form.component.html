<app-form-card [titulo]="isEdit ? 'Editar Dueño' : 'Nuevo Dueño'">
  @if (noEncontrado) {
    <app-alerta-error mensaje="No se encontró el dueño." variante="formulario"></app-alerta-error>
    <a [routerLink]="['/vet/duenos']" class="btn btn-dogtor w-100">Volver a dueños</a>
  } @else {
    @if (errorMensaje) {
      <app-alerta-error [mensaje]="errorMensaje" variante="formulario"></app-alerta-error>
    }

    <form [formGroup]="duenoForm" novalidate>
      <app-campo-texto
        campoId="cedula"
        etiqueta="Cédula"
        placeholder="Ej: 1000000001"
        [control]="duenoForm.controls.cedula"
        [mensajes]="mensajes.cedula"
      ></app-campo-texto>
      <app-campo-texto
        campoId="nombre"
        etiqueta="Nombre completo"
        placeholder="Ej: Juan Pérez"
        [control]="duenoForm.controls.nombre"
        [mensajes]="mensajes.nombre"
      ></app-campo-texto>
      <app-campo-texto
        campoId="celular"
        etiqueta="Celular"
        placeholder="Ej: 3001234567"
        [control]="duenoForm.controls.celular"
        [mensajes]="mensajes.celular"
      ></app-campo-texto>
      <app-campo-texto
        campoId="correo"
        etiqueta="Correo"
        tipo="email"
        placeholder="Ej: juan.perez@correo.com"
        [control]="duenoForm.controls.correo"
        [mensajes]="mensajes.correo"
      ></app-campo-texto>
      <app-campo-texto
        campoId="password"
        [etiqueta]="isEdit ? 'Nueva contraseña (opcional)' : 'Contraseña de acceso'"
        tipo="password"
        [placeholder]="isEdit ? 'Déjala vacía para no cambiarla' : 'Mínimo 6 caracteres'"
        [control]="duenoForm.controls.password"
        [mensajes]="mensajes.password"
      ></app-campo-texto>

      <app-form-acciones [cargando]="cargando" [rutaCancelar]="['/vet/duenos']"></app-form-acciones>
    </form>
  }
</app-form-card>
